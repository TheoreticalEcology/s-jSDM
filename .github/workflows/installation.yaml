# Checks that a clean machine can install sjSDM and fit a model, i.e. that the only
# non-CRAN dependency (the libtorch binaries) installs on every platform.
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: Automatic-installation

jobs:
  Automatic-installation:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TORCH_INSTALL: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sjSDM

      - name: Install sjSDM
        run: R CMD INSTALL sjSDM

      # this is what install_sjSDM() does; check the documented path works
      - name: Install dependencies the way a user would
        run: |
          sjSDM::install_sjSDM()
          sjSDM::install_diagnostic()
        shell: Rscript {0}

      - name: Fit a model
        env:
          CI: true
        run: |
          library(sjSDM)
          com = simulate_SDM(env = 3L, species = 7L, sites = 50L)
          model = sjSDM(Y = com$response, env = com$env_weights, iter = 5L, verbose = FALSE)
          stopifnot(is.finite(logLik(model)))
          stopifnot(all(dim(getCov(model)) == c(7L, 7L)))
          cat("logLik:", logLik(model), "\n")
        shell: Rscript {0}
